[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["insd47"]
license = "MIT"
repository = "https://github.com/insd47/sst-link"

[workspace.dependencies]
sst-link-derive = { version = "=0.2.0", path = "crates/sst-link-derive" }

quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sst_sdk = "4"
syn = "2"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
self_named_module_files = "warn"
redundant_pub_crate = "warn"
